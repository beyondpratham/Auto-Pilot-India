[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autopilot-india"
version = "0.1.0"
description = "Object detection and risk-weighted navigation decisions for Indian road scenes"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["autopilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
